name: lms
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  cloud_firestore: ^6.7.1
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  extensions_kit: ^1.1.8
  flutter_rating_bar: ^4.0.1
  flutter_spinkit: ^5.2.2
  cached_network_image: ^3.4.1
  step_progress_indicator: ^1.0.2
  go_router: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter  
  flutter_lints: ^5.0.0
  vector_graphics_compiler: ^1.1.17
  build_runner: ^2.0.0


flutter:  
  uses-material-design: true

   # Assets:
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/audio/
    
    - path: assets/svg/
      transformers:
        - package: vector_graphics_compiler

 # FONTS
  fonts:
    - family: PlusSans_Light
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Light.ttf

    - family: PlusSans_Medium
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf

    - family: PlusSans_Regular
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf

    - family: PlusSans_Bold
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf