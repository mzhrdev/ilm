name: lms
description: "Smart, modern tech-driven education system."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.8.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"  


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  cloud_firestore: ^6.7.1
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  extensions_kit: ^1.1.8
  flutter_rating_bar: ^4.0.1
  flutter_spinkit: ^5.2.2
  cached_network_image: ^3.4.1
  step_progress_indicator: ^1.0.2
  go_router: ^17.0.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  uuid: ^4.6.0
  flutter_launcher_icons: ^0.14.4
  firebase_storage: ^13.4.6
  image_picker: ^1.2.3
  stream_video_flutter: ^0.8.2
  http: ^1.6.0
  flutter_ringtone_player: ^4.0.0+4
  proximity_sensor: ^2.0.0
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter  
  flutter_lints: ^5.0.0
  vector_graphics_compiler: ^1.1.17
  build_runner: ^2.0.0


flutter:  
  uses-material-design: true

   # Assets:
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/audio/
    
    - path: assets/svg/
      transformers:
        - package: vector_graphics_compiler

 # FONTS
  fonts:
    - family: PlusSans_Light
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Light.ttf

    - family: PlusSans_Medium
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf

    - family: PlusSans_Regular
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf

    - family: PlusSans_Bold
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf